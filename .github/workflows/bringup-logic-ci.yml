name: Bring-up logic CI

on:
  push:
    branches:
      - bootstrap/compiler
      - bootstrap/bringup-automation
    paths:
      - scripts/select_bringup_entry_points.ps1
      - scripts/auto_bringup.ps1
      - scripts/plan_bringup_action.ps1
      - scripts/snapshot_bringup_iteration.ps1
      - scripts/ci_bringup_automation_smoke.ps1
      - scripts/check_probe_readiness.ps1
      - scripts/ci_probe_readiness_smoke.ps1
      - scripts/triage_first_boot.ps1
      - scripts/ci_first_boot_triage_smoke.ps1
      - AUTO_BRINGUP.cmd
      - .github/workflows/bringup-logic-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/select_bringup_entry_points.ps1
      - scripts/auto_bringup.ps1
      - AUTO_BRINGUP.cmd
      - .github/workflows/bringup-logic-ci.yml

jobs:
  guarded-entry-selection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse bring-up scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($p in @('.\scripts\select_bringup_entry_points.ps1','.\scripts\auto_bringup.ps1','.\scripts\check_probe_readiness.ps1','.\scripts\ci_probe_readiness_smoke.ps1','.\scripts\triage_first_boot.ps1','.\scripts\ci_first_boot_triage_smoke.ps1','.\scripts\plan_bringup_action.ps1','.\scripts\snapshot_bringup_iteration.ps1','.\scripts\ci_bringup_automation_smoke.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "Parser errors in $p"}
          }

      - name: Validate ELF-runner readiness identity lock
        shell: powershell
        run: |
          .\scripts\ci_probe_readiness_smoke.ps1 -Root _ci\ready
          if($LASTEXITCODE -ne 0){throw "readiness smoke failed with $LASTEXITCODE"}
      - name: Validate first-boot triage classifications
        shell: powershell
        run: |
          .\scripts\ci_first_boot_triage_smoke.ps1 -Root _ci\triage
          if($LASTEXITCODE -ne 0){throw "triage smoke failed with $LASTEXITCODE"}
      - name: Validate evidence-driven bring-up automation
        shell: powershell
        run: |
          .\scripts\ci_bringup_automation_smoke.ps1 -Root _ci\bringup_automation
          if($LASTEXITCODE -ne 0){throw "bring-up automation smoke failed with $LASTEXITCODE"}
      - name: Select only valid new entries for missing-function triage
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force _ci\bringup | Out-Null
          @{new_entry_point_candidates=@('0x00123450','0x00123451','0x90000000','0x00123460')} | ConvertTo-Json | Set-Content _ci\bringup\suggestions.json -Encoding utf8
          @{primary_classification='missing-function'} | ConvertTo-Json | Set-Content _ci\bringup\triage.json -Encoding utf8
          '0x00123460' | Set-Content _ci\bringup\existing.txt -Encoding ascii
          .\scripts\select_bringup_entry_points.ps1 -Suggestions _ci\bringup\suggestions.json -Triage _ci\bringup\triage.json -Existing _ci\bringup\existing.txt -Out _ci\bringup\selection.json
          if($LASTEXITCODE -ne 0){throw "selector failed with $LASTEXITCODE"}
          $r=Get-Content _ci\bringup\selection.json -Raw|ConvertFrom-Json
          if([int]$r.selected_count -ne 1){throw "Expected exactly one selection, got $($r.selected_count)"}
          if($r.selected -notcontains '0x00123450'){throw 'Expected 0x00123450 to be selected'}
          if($r.selected -contains '0x00123451'){throw 'Unaligned PC was selected'}
          if($r.selected -contains '0x90000000'){throw 'Out-of-range PC was selected'}
          if($r.selected -contains '0x00123460'){throw 'Already configured PC was selected'}

      - name: Bound automatic entry growth and block non-missing-function triage
        shell: powershell
        run: |
          @{new_entry_point_candidates=@('0x00123450','0x00123454','0x00123458','0x0012345C','0x00123460')} | ConvertTo-Json | Set-Content _ci\bringup\many_suggestions.json -Encoding utf8
          @{primary_classification='missing-function'} | ConvertTo-Json | Set-Content _ci\bringup\missing_triage.json -Encoding utf8
          .\scripts\select_bringup_entry_points.ps1 -Suggestions _ci\bringup\many_suggestions.json -Triage _ci\bringup\missing_triage.json -MaxSelected 2 -Out _ci\bringup\bounded_selection.json
          if($LASTEXITCODE -ne 0){throw "bounded selector failed with $LASTEXITCODE"}
          $r=Get-Content _ci\bringup\bounded_selection.json -Raw|ConvertFrom-Json
          if([int]$r.selected_count -ne 2){throw "Expected selection cap=2, got $($r.selected_count)"}

          @{primary_classification='iop-module-load'} | ConvertTo-Json | Set-Content _ci\bringup\iop_triage.json -Encoding utf8
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\select_bringup_entry_points.ps1 -Suggestions _ci\bringup\many_suggestions.json -Triage _ci\bringup\iop_triage.json -Out _ci\bringup\iop_selection.json
          $rc=$LASTEXITCODE
          if($rc -ne 3){throw "Expected IOP triage to block with exit 3, got $rc"}
          $r=Get-Content _ci\bringup\iop_selection.json -Raw|ConvertFrom-Json
          if(!$r.blocked -or [int]$r.selected_count -ne 0){throw 'IOP triage must not add EE entry points'}
          $global:LASTEXITCODE=0
      - name: Block automatic changes on fatal triage
        shell: powershell
        run: |
          @{new_entry_point_candidates=@('0x00123450')} | ConvertTo-Json | Set-Content _ci\bringup\fatal_suggestions.json -Encoding utf8
          @{primary_classification='fatal-or-exception'} | ConvertTo-Json | Set-Content _ci\bringup\fatal_triage.json -Encoding utf8
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\select_bringup_entry_points.ps1 -Suggestions _ci\bringup\fatal_suggestions.json -Triage _ci\bringup\fatal_triage.json -Out _ci\bringup\fatal_selection.json
          $rc=$LASTEXITCODE
          if($rc -ne 3){throw "Expected guarded exit 3, got $rc"}
          $r=Get-Content _ci\bringup\fatal_selection.json -Raw|ConvertFrom-Json
          if(!$r.blocked){throw 'Fatal triage was not marked blocked'}
          if([int]$r.selected_count -ne 0){throw 'Fatal triage selected an entry point'}
          $global:LASTEXITCODE=0
