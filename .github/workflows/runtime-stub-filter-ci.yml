name: Runtime stub filter CI

on:
  push:
    branches:
      - bootstrap/status-enhance
      - bootstrap/compiler
    paths:
      - scripts/filter_runtime_stubs.ps1
      - scripts/build_downhill.ps1
      - .github/workflows/runtime-stub-filter-ci.yml

jobs:
  filter-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\filter_runtime_stubs.ps1"),[ref]$tokens,[ref]$errors)|Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\build_downhill.ps1"),[ref]$tokens,[ref]$errors)|Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\status_downhill.ps1"),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parser errors"}

      - name: Create runtime fixture
        shell: powershell
        run: |
          $root=(Resolve-Path ".").Path
          $fake=Join-Path $root "_filter_fixture\ps2xRuntime\src\lib\Kernel\Stubs"
          New-Item -ItemType Directory -Force -Path $fake|Out-Null
          @'
          void GoodHandler(unsigned char*, void*, void*)
          {
              int realImplementation = 1;
              (void)realImplementation;
          }

          void TodoHandler(unsigned char*, void*, void*)
          {
              TODO_NAMED("TodoHandler");
          }
          '@ | Set-Content -LiteralPath (Join-Path $fake "Fixture.cpp") -Encoding ASCII

          @'
          [general]
          input = "dummy.elf"
          output = "out"
          stubs = [
            "GoodHandler@0x00100000",
            "TodoHandler@0x00100010",
            "MissingHandler@0x00100020",
          ]
          entry_points = [
            "existing@0x00100030",
          ]
          skip = []
          '@ | Set-Content -LiteralPath "_filter_fixture\config.toml" -Encoding ASCII

      - name: Filter incomplete handlers
        shell: powershell
        run: |
          .\scripts\filter_runtime_stubs.ps1 -Config "_filter_fixture\config.toml" -Ps2RecompRoot "_filter_fixture" -Out "_filter_fixture\report.json"
          $report=Get-Content "_filter_fixture\report.json" -Raw|ConvertFrom-Json
          if([int]$report.safe_stub_count -ne 1){throw "Expected one safe stub"}
          if([int]$report.unsafe_stub_count -ne 2){throw "Expected two guest-preserved stubs"}
          $cfg=Get-Content "_filter_fixture\config.toml" -Raw
          $stubBody=[regex]::Match($cfg,'(?ms)^stubs\s*=\s*\[(.*?)^\s*\]').Groups[1].Value
          $entryBody=[regex]::Match($cfg,'(?ms)^entry_points\s*=\s*\[(.*?)^\s*\]').Groups[1].Value
          if($stubBody -notmatch 'GoodHandler@0x00100000'){throw "Good handler removed unexpectedly"}
          if($stubBody -match 'TodoHandler@0x00100010'){throw "TODO handler remained stubbed"}
          if($stubBody -match 'MissingHandler@0x00100020'){throw "Missing handler remained stubbed"}
          if($entryBody -notmatch 'TodoHandler@0x00100010'){throw "TODO guest function not preserved as entry"}
          if($entryBody -notmatch 'MissingHandler@0x00100020'){throw "Missing guest function not preserved as entry"}
          Write-Host $cfg
