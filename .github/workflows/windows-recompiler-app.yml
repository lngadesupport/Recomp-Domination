name: Windows Recompiler App
on:
  push:
    branches: [bootstrap/compiler]
    paths: ['launcher/**', '.github/workflows/windows-recompiler-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package project and compile standalone launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          git archive --format=zip --output=dist/payload.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Payload failed' }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /platform:x64 /out:dist/RecompDomination.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /resource:dist/payload.zip,payload.zip launcher/RecompDomination.cs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          $scriptFiles = @('launcher/setup_and_compile.ps1', 'scripts/test_downhill_windows.ps1')
          foreach ($file in $scriptFiles) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $app = Start-Process dist/RecompDomination.exe -PassThru
          Start-Sleep -Seconds 3
          if ($app.HasExited) { throw 'Launcher exited during smoke test' }
          $app.Kill()
          Remove-Item dist/payload.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RecompDomination-Windows-x64
          path: dist/RecompDomination.exe
          retention-days: 30
