name: Probe readiness CI

on:
  push:
    branches:
      - bootstrap/compiler
    paths:
      - scripts/check_probe_readiness.ps1
      - scripts/build_downhill.ps1
      - .github/workflows/probe-readiness-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/check_probe_readiness.ps1
      - scripts/build_downhill.ps1
      - .github/workflows/probe-readiness-ci.yml

concurrency:
  group: probe-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse readiness script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\check_probe_readiness.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'Readiness parser errors'}

      - name: Prepare valid synthetic build identity
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force _ci\ready\DownhillRecompiled | Out-Null
          $root=(Resolve-Path _ci\ready).Path
          $dist=Join-Path $root 'DownhillRecompiled'
          [byte[]]$elf=New-Object byte[] 128
          $elf[0]=0x7F;$elf[1]=0x45;$elf[2]=0x4C;$elf[3]=0x46;$elf[4]=1;$elf[5]=1
          [BitConverter]::GetBytes([uint16]2).CopyTo($elf,16)
          [BitConverter]::GetBytes([uint16]8).CopyTo($elf,18)
          [BitConverter]::GetBytes([uint32]0x0010A008).CopyTo($elf,24)
          [IO.File]::WriteAllBytes((Join-Path $root 'SCUS_971.77'),$elf)
          [IO.File]::WriteAllBytes((Join-Path $dist 'ps2EntryRunner.exe'),[byte[]](1..96))

          function Get-Crc32([byte[]]$Data){
            [uint32]$poly=[Convert]::ToUInt32('EDB88320',16);[uint32]$crc=[Convert]::ToUInt32('FFFFFFFF',16)
            [uint32[]]$table=New-Object 'UInt32[]' 256
            for($i=0;$i-lt 256;$i++){[uint32]$v=$i;for($j=0;$j-lt 8;$j++){if(($v-band 1)-ne 0){$v=[uint32](($v-shr 1)-bxor$poly)}else{$v=[uint32]($v-shr 1)}};$table[$i]=$v}
            foreach($b in $Data){$idx=[int](($crc-bxor[uint32]$b)-band 0xFF);$crc=[uint32]($table[$idx]-bxor($crc-shr 8))}
            [uint32]($crc-bxor[Convert]::ToUInt32('FFFFFFFF',16))
          }
          $elfPath=Join-Path $root 'SCUS_971.77'
          $runner=Join-Path $dist 'ps2EntryRunner.exe'
          $sha=(Get-FileHash $elfPath -Algorithm SHA256).Hash
          $runnerSha=(Get-FileHash $runner -Algorithm SHA256).Hash
          [uint32]$crc=Get-Crc32 $elf
          $crcText=('0x{0:X8}' -f $crc)
          $build=[ordered]@{
            result='build-complete'
            ps2recomp_commit='75d729ce40d7eed9649fd4bb05628dee520f3d0c'
            elf_identity=[ordered]@{size_bytes=128;sha256=$sha;entry='0x0010A008';pcsx2_elf_crc='0x00000000';crc32_ieee=$crcText;anchors_valid=$true}
            metrics=[ordered]@{runner_sha256=$runnerSha;runtime_override_crc32_ieee=$crcText}
          }
          [IO.File]::WriteAllText((Join-Path $dist 'build_report.json'),($build|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          @'
[general]
entry_points = [
  "0x0010A008",
  "0x001FB6C0",
  "0x00254050",
  "0x0025C440",
]
stubs = [
  "scePadRead@0x00254050",
  "sceSifSendCmd@0x0025C440",
]
'@ | Set-Content (Join-Path $dist 'downhill.auto.toml') -Encoding ascii
          $sha | Set-Content _ci\ready\sha.txt -Encoding ascii

      - name: Accept matching ELF runner and report
        shell: powershell
        run: |
          $root=(Resolve-Path _ci\ready).Path
          $dist=Join-Path $root 'DownhillRecompiled'
          $sha=(Get-Content _ci\ready\sha.txt -Raw).Trim()
          .\scripts\check_probe_readiness.ps1 -Elf (Join-Path $root 'SCUS_971.77') -Report (Join-Path $dist 'build_report.json') -Runner (Join-Path $dist 'ps2EntryRunner.exe') -Config (Join-Path $dist 'downhill.auto.toml') -ExpectedSha256 $sha -ExpectedSize 128
          if($LASTEXITCODE -ne 0){throw "Matching readiness fixture failed with $LASTEXITCODE"}
          $r=Get-Content (Join-Path $dist 'probe_readiness.json') -Raw|ConvertFrom-Json
          if(!$r.ready){throw 'Matching readiness report was not ready'}

      - name: Reject a stale modified runner
        shell: powershell
        run: |
          $root=(Resolve-Path _ci\ready).Path
          $dist=Join-Path $root 'DownhillRecompiled'
          Add-Content -LiteralPath (Join-Path $dist 'ps2EntryRunner.exe') -Value 'stale' -Encoding ascii
          $sha=(Get-Content _ci\ready\sha.txt -Raw).Trim()
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\check_probe_readiness.ps1 -Elf (Join-Path $root 'SCUS_971.77') -Report (Join-Path $dist 'build_report.json') -Runner (Join-Path $dist 'ps2EntryRunner.exe') -Config (Join-Path $dist 'downhill.auto.toml') -ExpectedSha256 $sha -ExpectedSize 128
          $rc=$LASTEXITCODE
          if($rc -ne 1){throw "Expected stale runner rejection exit 1, got $rc"}
          $r=Get-Content (Join-Path $dist 'probe_readiness.json') -Raw|ConvertFrom-Json
          if($r.ready){throw 'Stale runner was incorrectly accepted'}
          $global:LASTEXITCODE=0
