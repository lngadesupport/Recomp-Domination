name: Compiler bootstrap CI

concurrency:
  group: bootstrap-compiler-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - bootstrap/compiler
  pull_request:
    branches:
      - main

jobs:
  windows-toolchain:
    runs-on: windows-latest
    steps:
      - name: Checkout Recomp Domination
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              Write-Host "Parser errors in $($_.FullName):"
              $errors | Format-List | Out-String | Write-Host
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell parser reported one or more errors.' }

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              Write-Host "Parser errors in $($_.FullName):"
              $errors | Format-List | Out-String | Write-Host
              $failed = $true
            }
          }
          if ($failed) { throw 'Windows PowerShell parser reported one or more errors.' }
      - name: Smoke-test local game-data preparation
        shell: powershell
        run: |
          $root = (New-Item -ItemType Directory -Force _ci\game_data_smoke).FullName
          $disc = (New-Item -ItemType Directory -Force (Join-Path $root 'disc')).FullName
          [IO.File]::WriteAllBytes((Join-Path $root 'SCUS_971.77'), [byte[]](1..16))
          'BOOT2 = cdrom0:\SCUS_971.77;1' | Set-Content (Join-Path $disc 'SYSTEM.CNF') -Encoding ascii
          .\scripts\prepare_game_data.ps1 -GameRoot $root
          $sidecar = (Get-Content (Join-Path $root 'downhill_cd_root.txt') -Raw).Trim()
          if ([IO.Path]::GetFullPath($sidecar) -ne [IO.Path]::GetFullPath($disc)) {
            throw "CD root sidecar mismatch: $sidecar"
          }

      - name: Smoke-test explicit entry suggestion acceptance
        shell: powershell
        run: |
          $root = (New-Item -ItemType Directory -Force _ci\entry_accept_smoke).FullName
          $dist = (New-Item -ItemType Directory -Force (Join-Path $root 'DownhillRecompiled')).FullName
          @{
            new_entry_point_candidates = @('0x00123450','0x90000000')
          } | ConvertTo-Json | Set-Content (Join-Path $dist 'first_boot_suggestions.json') -Encoding utf8
          .\scripts\accept_entry_suggestions.ps1 -GameRoot $root
          $accepted = @(Get-Content .\config\downhill.extra_entry_points.local.txt)
          if ($accepted -notcontains '0x00123450') { throw 'Valid entry suggestion was not accepted' }
          if ($accepted -contains '0x90000000') { throw 'Out-of-range entry suggestion was accepted' }
          Remove-Item .\config\downhill.extra_entry_points.local.txt -Force
      - name: Clone pinned PS2Recomp
        shell: pwsh
        run: |
          git clone https://github.com/ran-j/PS2Recomp.git _ci/PS2Recomp
          git -C _ci/PS2Recomp checkout 75d729ce40d7eed9649fd4bb05628dee520f3d0c

      - name: Apply Downhill VIF1 compatibility patch
        shell: powershell
        run: |
          .\scripts\patch_downhill_ps2recomp.ps1 -Ps2RecompRoot _ci\PS2Recomp
          $src = Get-Content _ci\PS2Recomp\ps2xRuntime\src\lib\ps2_memory.cpp -Raw
          if ($src -notmatch 'savedRow\[4\]' -or $src -notmatch 'savedCol\[4\]') {
            throw 'Downhill VIF1 ROW/COL patch is not present after patch step.'
          }
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Smoke-test multipart RAR canonical hardlinks
        shell: powershell
        run: |
          $root = (New-Item -ItemType Directory -Force _ci\multipart_smoke).FullName
          [IO.File]::WriteAllBytes((Join-Path $root 'SCUS_971.77'), [byte[]](1..16))
          foreach ($name in @('Game.part1.rar','Game.part2.rar','Game.part3(1).rar','Game.part4.rar')) {
            [IO.File]::WriteAllBytes((Join-Path $root $name), [byte[]](1..32))
          }
          $fakeBin = (New-Item -ItemType Directory -Force _ci\fake7z).FullName
          @'
          using System;
          using System.IO;
          public static class Program {
            public static int Main(string[] args) {
              if (args == null || args.Length < 2) return 2;
              string archive = args[args.Length - 1];
              string dir = Path.GetDirectoryName(Path.GetFullPath(archive));
              if (!File.Exists(Path.Combine(dir, "Game.part3.rar"))) return 13;
              if (String.Equals(args[0], "t", StringComparison.OrdinalIgnoreCase)) return 0;
              if (String.Equals(args[0], "x", StringComparison.OrdinalIgnoreCase)) {
                string output = null;
                foreach (string arg in args) {
                  if (arg.StartsWith("-o", StringComparison.OrdinalIgnoreCase)) output = arg.Substring(2);
                }
                if (String.IsNullOrWhiteSpace(output)) return 14;
                Directory.CreateDirectory(output);
                File.WriteAllText(Path.Combine(output, "SYSTEM.CNF"), "BOOT2 = cdrom0:\\SCUS_971.77;1");
                return 0;
              }
              return 3;
            }
          }
          '@ | Set-Content _ci\fake7z.cs -Encoding ascii
          csc /nologo /target:exe /out:_ci\fake7z\7z.exe _ci\fake7z.cs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build fake 7z.exe' }
          $env:PATH = $fakeBin + ';' + $env:PATH
          .\scripts\prepare_game_data.ps1 -GameRoot $root
          if (!(Test-Path (Join-Path $root 'game_data\SYSTEM.CNF'))) { throw 'Multipart smoke did not produce SYSTEM.CNF' }
          $cdRoot = (Get-Content (Join-Path $root 'downhill_cd_root.txt') -Raw).Trim()
          if ([IO.Path]::GetFullPath($cdRoot) -ne [IO.Path]::GetFullPath((Join-Path $root 'game_data'))) {
            throw "Multipart CD root mismatch: $cdRoot"
          }
          if (Test-Path (Join-Path $root '.downhill_rar_staging')) { throw 'Multipart staging directory was not cleaned up' }
      - name: Compile Downhill override against pinned runtime headers
        shell: cmd
        run: >-
          cl /nologo /std:c++20 /EHsc /c
          src\downhill_domination_overrides.cpp
          /Fo:_ci\downhill_domination_overrides.obj
          /I _ci\PS2Recomp\ps2xRuntime\include
          /I _ci\PS2Recomp\ps2xIOP\include
      - name: Configure compiler tools
        shell: pwsh
        run: >-
          cmake -S _ci/PS2Recomp -B _ci/build -A x64
          -DPS2X_BUILD_RUNTIME=OFF
          -DPS2X_BUILD_RECOMP=ON
          -DPS2X_BUILD_ANALYZER=ON
          -DPS2X_BUILD_TEST=OFF
          -DPS2X_BUILD_STUDIO=OFF

      - name: Build ps2_recomp and ps2_analyzer
        shell: pwsh
        run: cmake --build _ci/build --config Release --target ps2_recomp ps2_analyzer --parallel

      - name: Verify expected executables
        shell: pwsh
        run: |
          $recomp = Get-ChildItem _ci/build -Recurse -Filter ps2_recomp.exe -File | Select-Object -First 1
          $analyzer = Get-ChildItem _ci/build -Recurse -Filter ps2_analyzer.exe -File | Select-Object -First 1
          if (!$recomp) { throw 'ps2_recomp.exe not produced' }
          if (!$analyzer) { throw 'ps2_analyzer.exe not produced' }
          Write-Host "ps2_recomp: $($recomp.FullName)"
          Write-Host "ps2_analyzer: $($analyzer.FullName)"
      - name: Recompile synthetic MIPS ELF end to end
        shell: pwsh
        run: .\scripts\ci_recompile_smoke.ps1 -Ps2RecompRoot _ci/PS2Recomp -BuildRoot _ci/build
      - name: Analyze synthetic generated output
        shell: pwsh
        run: |
          .\scripts\analyze_recompiled_output.ps1 `
            -Config _ci\smoke\smoke.toml `
            -GeneratedDir _ci\PS2Recomp\ps2xRuntime\src\runner `
            -Out _ci\smoke\recompiled_report.json
          if (!(Test-Path _ci\smoke\recompiled_report.json)) { throw 'recompiled_report.json not produced' }
      - name: Test first-boot suggestion parser
        shell: pwsh
        run: |
          @(
            'Error: No exact recompiled function for guest PC 0x00123450 tableBase=0x00100000 tableEnd=0x00300000 codeRegion=yes trace=0x00110000',
            'Warning: Unimplemented PS2 stub called. name=sceCdRead PC=0x00123400, RA=0x00122000, Stub# guess (from $v0)=0x0'
          ) | Set-Content _ci\smoke\fake_boot.log -Encoding ascii
          .\scripts\suggest_bringup_fixes.ps1 -Log _ci\smoke\fake_boot.log -Config _ci\smoke\smoke.toml -Out _ci\smoke\suggestions.json
          $s = Get-Content _ci\smoke\suggestions.json -Raw | ConvertFrom-Json
          if ($s.new_entry_point_candidates -notcontains '0x00123450') { throw 'Missing expected entry-point suggestion' }
          if (($s.unimplemented_stubs | Where-Object name -eq 'sceCdRead').Count -ne 1) { throw 'Missing expected stub suggestion' }
      - name: Audit runtime stub implementation status
        shell: pwsh
        run: |
          @'
          [general]
          stubs = [
            "scePadRead@0x00254050",
            "sceSifSendCmd@0x0025C440",
            "sceCdRI@0x00111110",
          ]
          '@ | Set-Content _ci\smoke\stub_audit.toml -Encoding utf8
          .\scripts\audit_runtime_stubs.ps1 -Config _ci\smoke\stub_audit.toml -Ps2RecompRoot _ci\PS2Recomp -Out _ci\smoke\stub_audit.json
          $audit = Get-Content _ci\smoke\stub_audit.json -Raw | ConvertFrom-Json
          $pad = $audit.stubs | Where-Object requested_name -eq 'scePadRead'
          $sif = $audit.stubs | Where-Object requested_name -eq 'sceSifSendCmd'
          $cdri = $audit.stubs | Where-Object requested_name -eq 'sceCdRI'
          if ($pad.status -ne 'implemented') { throw "scePadRead audit mismatch: $($pad.status)" }
          if ($sif.status -ne 'implemented') { throw "sceSifSendCmd audit mismatch: $($sif.status)" }
          if ($cdri.status -ne 'todo') { throw "sceCdRI audit mismatch: $($cdri.status)" }
      - name: Stage Downhill override in runtime runner
        shell: pwsh
        run: Copy-Item src/downhill_domination_overrides.cpp _ci/PS2Recomp/ps2xRuntime/src/runner/downhill_domination_overrides.cpp -Force

      - name: Configure runtime with generated C++
        shell: pwsh
        run: >-
          cmake -S _ci/PS2Recomp -B _ci/build
          -A x64
          -DPS2X_BUILD_RUNTIME=ON
          -DPS2X_BUILD_RECOMP=ON
          -DPS2X_BUILD_ANALYZER=ON
          -DPS2X_BUILD_TEST=OFF
          -DPS2X_BUILD_STUDIO=OFF
          -DPS2X_ENABLE_FFMPEG=OFF
          -DPS2X_ENABLE_DEBUG_UI=OFF
          -DPS2X_ENABLE_RUNTIME_LOGS=ON
          -DPS2X_ENABLE_AGRESSIVE_LOGS=ON
          -DPS2X_ENABLE_IOP_RPC_TRACE=ON
          -DPS2X_STRICT_RETURN_DIAGNOSTICS=ON
          -DPS2X_ENABLE_RUNNER_UNITY_BUILD=OFF
          -DCMAKE_CXX_FLAGS=/bigobj

      - name: Build runtime with generated C++
        shell: pwsh
        run: cmake --build _ci/build --config Release --target ps2EntryRunner --parallel

      - name: Verify native runner
        shell: pwsh
        run: |
          $runner = Get-ChildItem _ci/build -Recurse -Filter ps2EntryRunner.exe -File | Select-Object -First 1
          if (!$runner) { throw 'ps2EntryRunner.exe not produced' }
          Write-Host "ps2EntryRunner: $($runner.FullName)"
