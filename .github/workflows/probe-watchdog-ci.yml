name: Probe watchdog CI

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/compiler
      - bootstrap/runtime-triage
    paths:
      - scripts/run_downhill_probe.ps1
      - scripts/triage_first_boot.ps1
      - scripts/suggest_bringup_fixes.ps1
      - .github/workflows/probe-watchdog-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_downhill_probe.ps1
      - scripts/triage_first_boot.ps1
      - scripts/suggest_bringup_fixes.ps1
      - .github/workflows/probe-watchdog-ci.yml

concurrency:
  group: probe-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeout-probe:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build fake long-running runner
        shell: cmd
        run: >-
          echo #include ^<cstdio^> > probe_fake.cpp && echo #include ^<windows.h^> >> probe_fake.cpp && echo int main(){puts("probe fake runner stdout"); fputs("[MPEG] runtime built without FFmpeg; MPEG video decode is disabled.\n", stderr); fputs("sceCdRead failed cdrom0:\\MOVIE\\INTRO.PSS;1 not found\n", stderr); fflush(stdout); fflush(stderr); Sleep(10000); return 0;} >> probe_fake.cpp
          && mkdir probe_smoke
          && cl /nologo /EHsc probe_fake.cpp /Fe:probe_smoke\ps2EntryRunner.exe

      - name: Prepare probe inputs
        shell: powershell
        run: |
          Copy-Item .\scripts\run_downhill_probe.ps1 .\probe_smoke\run_downhill_probe.ps1
          Copy-Item .\scripts\triage_first_boot.ps1 .\probe_smoke\triage_first_boot.ps1
          Copy-Item .\scripts\suggest_bringup_fixes.ps1 .\probe_smoke\suggest_bringup_fixes.ps1
          [IO.File]::WriteAllBytes((Resolve-Path .\probe_smoke).Path + '\SCUS_971.77', [byte[]](1..16))

      - name: Verify one-second diagnostic timeout
        shell: powershell
        timeout-minutes: 1
        run: |
          $probe=(Resolve-Path .\probe_smoke).Path
          $script=(Join-Path $probe 'run_downhill_probe.ps1')
          $elf=(Join-Path $probe 'SCUS_971.77')
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -Elf $elf -TimeoutSeconds 1
          $rc=$LASTEXITCODE
          if($rc -ne 124){throw "Expected exit 124, got $rc"}
          $meta=Get-Content (Join-Path $probe 'first_boot_probe.json') -Raw | ConvertFrom-Json
          if(!$meta.timed_out){throw 'Probe did not record timeout'}
          if(!(Test-Path (Join-Path $probe 'first_boot_probe_latest.log'))){throw 'Combined probe log missing'}
          if(!(Test-Path (Join-Path $probe 'first_boot_probe_triage.json'))){throw 'Triage JSON missing'}
          if(!(Test-Path (Join-Path $probe 'first_boot_probe_suggestions.json'))){throw 'Suggestions JSON missing'}

          $triage=Get-Content (Join-Path $probe 'first_boot_probe_triage.json') -Raw | ConvertFrom-Json
          if([int]$triage.categories.mpeg_decoder_unavailable -lt 1){throw 'MPEG decoder-unavailable signal was not classified'}
          if([int]$triage.categories.cd_dvd -lt 1){throw 'CD/DVD failure signal was not classified'}
          if(!$triage.milestones.mpeg_activity){throw 'MPEG activity milestone was not set'}
          if(!$triage.milestones.cd_dvd_activity){throw 'CD/DVD activity milestone was not set'}

          $suggest=Get-Content (Join-Path $probe 'first_boot_probe_suggestions.json') -Raw | ConvertFrom-Json
          $signalKinds=@($suggest.runtime_signals | ForEach-Object kind)
          if($signalKinds -notcontains 'mpeg-decoder-disabled'){throw 'Missing MPEG rebuild suggestion'}
          if($signalKinds -notcontains 'cd-dvd-io'){throw 'Missing CD/DVD I/O suggestion'}

          Write-Host ('Probe duration: ' + $meta.duration_seconds + ' s')
          Write-Host ('Runtime signals: ' + ($signalKinds -join ', '))
          # The probe intentionally returns 124 on timeout. Verification above
          # consumed that expected code; do not let GitHub's PowerShell wrapper
          # propagate the stale native LASTEXITCODE as a failed step.
          $global:LASTEXITCODE = 0
