name: Probe watchdog CI

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/compiler
    paths:
      - scripts/run_downhill_probe.ps1
      - scripts/triage_first_boot.ps1
      - scripts/suggest_bringup_fixes.ps1
      - .github/workflows/probe-watchdog-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_downhill_probe.ps1
      - scripts/triage_first_boot.ps1
      - scripts/suggest_bringup_fixes.ps1
      - .github/workflows/probe-watchdog-ci.yml

concurrency:
  group: probe-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeout-probe:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build fake long-running runner
        shell: cmd
        run: >-
          echo #include ^<cstdio^> > probe_fake.cpp && echo #include ^<windows.h^> >> probe_fake.cpp && echo int main(){puts("probe fake runner stdout"); fputs("probe fake runner stderr\n", stderr); fflush(stdout); fflush(stderr); Sleep(10000); return 0;} >> probe_fake.cpp
          && mkdir probe_smoke
          && cl /nologo /EHsc probe_fake.cpp /Fe:probe_smoke\ps2EntryRunner.exe

      - name: Prepare probe inputs
        shell: powershell
        run: |
          Copy-Item .\scripts\run_downhill_probe.ps1 .\probe_smoke\run_downhill_probe.ps1
          Copy-Item .\scripts\triage_first_boot.ps1 .\probe_smoke\triage_first_boot.ps1
          Copy-Item .\scripts\suggest_bringup_fixes.ps1 .\probe_smoke\suggest_bringup_fixes.ps1
          [IO.File]::WriteAllBytes((Resolve-Path .\probe_smoke).Path + '\SCUS_971.77', [byte[]](1..16))

      - name: Verify one-second diagnostic timeout
        shell: powershell
        timeout-minutes: 1
        run: |
          $probe=(Resolve-Path .\probe_smoke).Path
          $script=(Join-Path $probe 'run_downhill_probe.ps1')
          $elf=(Join-Path $probe 'SCUS_971.77')
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -Elf $elf -TimeoutSeconds 1
          $rc=$LASTEXITCODE
          if($rc -ne 124){throw "Expected exit 124, got $rc"}
          $meta=Get-Content (Join-Path $probe 'first_boot_probe.json') -Raw | ConvertFrom-Json
          if(!$meta.timed_out){throw 'Probe did not record timeout'}
          if(!(Test-Path (Join-Path $probe 'first_boot_probe_latest.log'))){throw 'Combined probe log missing'}
          if(!(Test-Path (Join-Path $probe 'first_boot_probe_triage.json'))){throw 'Triage JSON missing'}
          Write-Host ('Probe duration: ' + $meta.duration_seconds + ' s')
          # The probe intentionally returns 124 on timeout. Verification above
          # consumed that expected code; do not let GitHub's PowerShell wrapper
          # propagate the stale native LASTEXITCODE as a failed step.
          $global:LASTEXITCODE = 0


      - name: Classify IOP module outcomes
        shell: powershell
        run: |
          @(
            "[IOP] loaded IRX id=1 entry=0x00012000 base=0x00010000 start=0",
            "[IOP:HLE] fallback module='CDROM0:\IOP\LIBSD.IRX;1' physical IRX unavailable; using registered HLE provider",
            "[IOP:load-failed] module='CDROM0:\IOP\CUSTOM.IRX;1' no HLE provider accepted the module; physical IRX was not loaded",
            "[IOP] failed to open IRX 'CDROM0:\IOP\MISSING.IRX;1'",
            "[IOP] one or more IRX relocations were unsupported",
            "[IOP] unhandled import customlib:42 version=0x0102 pc=0x00012340",
            "[IOP/RPC trace:unhandled] sid=0x8000ABCD rpc=0x12 pc=0x00123450 ra=0x00120000 send=0x00100000/16 recv=0x00110000/32 sendBytes=[01 02] loadedModules=[LIBSD.IRX,CUSTOM.IRX]"
          ) | Set-Content .\probe_smoke\iop_fixture.log -Encoding ascii

          .\scripts\triage_first_boot.ps1 -Log .\probe_smoke\iop_fixture.log -Out .\probe_smoke\iop_triage.json
          $t=Get-Content .\probe_smoke\iop_triage.json -Raw|ConvertFrom-Json
          if($t.primary_classification -ne 'iop-module-load'){throw "Unexpected classification: $($t.primary_classification)"}
          if(@($t.iop_modules.loaded_irx).Count -ne 1){throw 'Expected one loaded IRX'}
          if(@($t.iop_modules.hle_fallbacks).Count -ne 1){throw 'Expected one HLE fallback'}
          if(@($t.iop_modules.load_failures).Count -ne 1){throw 'Expected one load failure'}
          if(@($t.iop_modules.failed_open).Count -ne 1){throw 'Expected one open failure'}
          if([int]$t.iop_modules.relocation_warnings -ne 1){throw 'Expected one relocation warning'}
          if(@($t.iop_modules.unhandled_imports).Count -ne 1){throw 'Expected one unhandled IOP import'}
          $imp=@($t.iop_modules.unhandled_imports)[0]
          if($imp.library -ne 'customlib' -or [int]$imp.ordinal -ne 42){throw 'Unhandled import details were parsed incorrectly'}
          if(@($t.rpc.unhandled_calls).Count -ne 1){throw 'Expected one unhandled RPC trace'}
          $rpc=@($t.rpc.unhandled_calls)[0]
          if($rpc.sid -ne '0X8000ABCD' -or $rpc.rpc -ne '0X12' -or $rpc.pc -ne '0X00123450'){throw 'Unhandled RPC details were parsed incorrectly'}

          .\scripts\suggest_bringup_fixes.ps1 -Log .\probe_smoke\iop_fixture.log -Out .\probe_smoke\iop_suggestions.json
          $s=Get-Content .\probe_smoke\iop_suggestions.json -Raw|ConvertFrom-Json
          if(@($s.iop.load_failed_modules).Count -ne 1){throw 'Suggestion report lost load-failed module'}
          if(@($s.iop.failed_open_modules).Count -ne 1){throw 'Suggestion report lost failed-open module'}
          if(@($s.iop.unhandled_imports).Count -ne 1){throw 'Suggestion report lost unhandled import'}
          if(@($s.rpc.unhandled_calls).Count -ne 1){throw 'Suggestion report lost unhandled RPC trace'}
          if($s.rpc.focus -notmatch '8000ABCD'){throw 'RPC focus does not identify the SID'}
          if(!$s.iop.focus){throw 'IOP focus was not produced'}
